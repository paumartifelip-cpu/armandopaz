<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armando Paz</title>
  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-surface: #fafafa;
      --border-main: #000000;
      --border-subtle: #e4e4e7;
      --text-main: #09090b;
      --text-muted: #71717a;
      --accent-black: #000000;
      --accent-hover: #27272a;
      --accent-success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important; /* Bordes estrictamente cuadrados */
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
    }

    /* PANTALLA 1: PORTADA ULTRA LIMPIA */
    #coverScreen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      background: var(--bg-main);
    }

    .cover-box {
      width: 100%;
      max-width: 600px;
      border: 2px solid var(--border-main);
      background: var(--bg-main);
      padding: 4rem 2.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--text-main);
      color: var(--bg-main);
      padding: 0.3rem 0.75rem;
    }

    .cover-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      line-height: 1;
    }

    .cover-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .enter-btn {
      background: var(--accent-black);
      color: var(--bg-main);
      border: 1px solid var(--border-main);
      padding: 1.25rem 2rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    .enter-btn:hover {
      background: var(--accent-hover);
    }

    /* PANTALLA 2: LA APLICACIÓN CON LAS RESEÑAS DIRECTAS */
    #appScreen {
      display: none;
      width: 100%;
      max-width: 900px;
      padding: 2.5rem 1.5rem;
      flex-direction: column;
      gap: 1.75rem;
    }

    header {
      border-bottom: 2px solid var(--border-main);
      padding-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      border: 1px solid var(--border-main);
      background: var(--bg-main);
      padding: 1.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-main);
    }

    input {
      background: var(--bg-main);
      border: 1px solid var(--border-main);
      padding: 0.9rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
    }

    .btn {
      background: var(--accent-black);
      color: var(--bg-main);
      border: 1px solid var(--border-main);
      padding: 1.1rem 1.4rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }
    .btn:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-main);
      padding: 0.45rem 0.85rem;
      font-size: 0.775rem;
      width: auto;
    }
    .btn-secondary:hover { background: var(--bg-surface); }

    /* Listado de Reseñas */
    .result-item {
      border: 1px solid var(--border-main);
      background: var(--bg-surface);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .verification-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border-main);
      display: inline-block;
      text-transform: uppercase;
      background: #dcfce7;
      color: #15803d;
    }

    .review-text {
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      padding: 0.75rem;
    }

    .response-text {
      background: var(--bg-main);
      border: 1px solid var(--border-main);
      padding: 1rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .loader {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- PANTALLA 1: PORTADA LIMPIA (SÓLO TÍTULO Y BOTÓN DE ENTRAR) -->
  <div id="coverScreen">
    <div class="cover-box">
      <span class="badge">ARMANDO PAZ AI</span>
      <h1 class="cover-title">Armando Paz</h1>
      <p class="cover-subtitle">El asistente para responder a todas las reseñas de tu negocio en Google Maps.</p>
      
      <button class="enter-btn" onclick="enterApp()">
        ENTRAR A LA APLICACIÓN →
      </button>
    </div>
  </div>

  <!-- PANTALLA 2: LA APLICACIÓN (MUESTRA LAS RESEÑAS DIRECTAMENTE) -->
  <div id="appScreen">
    <header>
      <div>
        <span class="badge" style="margin-bottom:0.25rem;">ARMANDO PAZ</span>
        <h2 style="font-family:'Space Grotesk',sans-serif; font-size:1.4rem; text-transform:uppercase;">Opiniones del Negocio</h2>
      </div>
      <button class="btn-secondary" onclick="goCover()">← Inicio</button>
    </header>

    <!-- Campo simple para cambiar el enlace -->
    <div class="card">
      <form id="urlForm">
        <div class="form-group">
          <label for="mapsUrl">Enlace de Google Maps del negocio</label>
          <input type="url" id="mapsUrl" value="https://www.google.com/maps/place/El+G%C3%BCero+Alte%C3%B1o+Cd.+Granja/@20.684961,-103.4621614,15z/" required>
        </div>
        <button type="submit" class="btn">
          <span class="loader" id="loader"></span>
          <span id="btnText">⚡ PROCESAR OTRO ENLACE</span>
        </button>
      </form>
    </div>

    <!-- MUESTRA DIRECTA DE LAS RESEÑAS Y SUS RESPUESTAS LISTAS PARA COPIAR -->
    <div id="resultsCard" class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-main); padding-bottom: 0.75rem; flex-wrap: wrap; gap: 0.75rem;">
        <div>
          <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; text-transform: uppercase;">
            📋 <span id="totalCountDisplay">40</span> RESEÑAS ENCONTRADAS Y RESPONDIDAS
          </h3>
        </div>
        <button class="btn btn-secondary" id="copyAllBtn">📋 Copiar TODAS en Lote</button>
      </div>

      <div id="resultsList"></div>
    </div>
  </div>

  <script>
    const coverScreen = document.getElementById('coverScreen');
    const appScreen = document.getElementById('appScreen');

    function enterApp() {
      coverScreen.style.display = 'none';
      appScreen.style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // Cargar reseñas automáticamente al entrar
      fetchReviews();
    }

    function goCover() {
      appScreen.style.display = 'none';
      coverScreen.style.display = 'flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const urlForm = document.getElementById('urlForm');
    const mapsUrlInput = document.getElementById('mapsUrl');
    const loader = document.getElementById('loader');
    const btnText = document.getElementById('btnText');
    const resultsList = document.getElementById('resultsList');
    const totalCountDisplay = document.getElementById('totalCountDisplay');

    let currentResults = [];

    urlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetchReviews();
    });

    async function fetchReviews() {
      const url = mapsUrlInput.value.trim();

      loader.style.display = 'inline-block';
      btnText.textContent = 'Procesando reseñas...';

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Error procesando enlace');

        totalCountDisplay.textContent = data.reviews ? data.reviews.length : 0;
        currentResults = data.reviews || [];
        renderResults(currentResults);
      } catch (err) {
        alert('Error procesando reseñas: ' + err.message);
      } finally {
        loader.style.display = 'none';
        btnText.textContent = '⚡ PROCESAR OTRO ENLACE';
      }
    }

    function renderResults(items) {
      resultsList.innerHTML = items.map((item, idx) => `
        <div class="result-item">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <span style="font-family:'Space Grotesk',sans-serif; font-weight:700;">👤 RESEÑA #${idx+1}: ${escapeHtml(item.reviewer)} (${escapeHtml(item.rating)})</span>
            <span class="verification-badge">RESEÑA COMPLETA</span>
          </div>
          <div class="review-text">"${escapeHtml(item.review)}"</div>
          <div class="response-text" id="resp_${idx}">${escapeHtml(item.response)}</div>
          <button class="btn btn-secondary" style="font-size:0.75rem;" onclick="copySingle(${idx}, this)">📋 COPIAR ESTA RESPUESTA</button>
        </div>
      `).join('');
    }

    function copySingle(idx, btn) {
      const text = document.getElementById(`resp_${idx}`).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ ¡COPIADO!';
        setTimeout(() => { btn.textContent = '📋 COPIAR ESTA RESPUESTA'; }, 1500);
      });
    }

    document.getElementById('copyAllBtn').addEventListener('click', () => {
      const fullText = currentResults.map(i => `[${i.reviewer}]\n${i.response}\n`).join('\n');
      navigator.clipboard.writeText(fullText).then(() => {
        const btn = document.getElementById('copyAllBtn');
        btn.textContent = '✅ ¡TODAS COPIADAS!';
        setTimeout(() => { btn.textContent = '📋 Copiar TODAS en Lote'; }, 2000);
      });
    });

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : '';
    }
  </script>
</body>
</html>
